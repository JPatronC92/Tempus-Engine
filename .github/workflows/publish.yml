name: Publish to crates.io

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # needed to walk the graph and verify the tag is on main

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # stable (v1)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main || {
            echo "ERROR: the pushed tag does not point to a commit on main" >&2
            exit 1
          }

      - name: Run tests before publishing
        run: cargo test --workspace

      - name: Publish tempus-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # NOTE: the git dependency on jsonlogic-fast must first be published to
        # crates.io (or replaced with a crates.io version) before this step
        # will succeed.  See CONTRIBUTING.md for the release checklist.
        run: cargo publish -p tempus-engine
