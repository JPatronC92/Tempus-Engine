site_name: Tempus Engine
site_description: Deterministic rule execution for decision systems
repo_url: https://github.com/JPatronC92/Tempus-Engine
repo_name: JPatronC92/Tempus-Engine

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - tables

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Why Determinism: why-determinism.md
  - API Reference:
      - Engine API: api/engine.md
      - Python Bindings: api/python.md
      - WASM Bindings: api/wasm.md
  - Guides:
      - Rule Chaining: guides/chaining.md
      - Explain Mode: guides/explain.md
      - Rule Store: guides/store.md

